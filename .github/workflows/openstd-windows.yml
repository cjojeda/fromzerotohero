name: OpenSTD Desktop Windows Alpha
on:
  workflow_dispatch:
  push:
    paths:
      - 'openstd-ultimate/native/**'
      - '.github/workflows/openstd-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: openstd-ultimate/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.11.1
      - name: Package Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OpenSTD-Ultimate-Alpha desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSTD-Ultimate-Windows-Alpha
          path: openstd-ultimate/native/dist/OpenSTD-Ultimate-Alpha.exe
          if-no-files-found: error
